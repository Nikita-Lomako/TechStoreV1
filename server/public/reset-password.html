<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Новый пароль — TechStore</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08);
      }
      .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 20px; margin: 0 0 24px; }
      h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
      p { color: #4b5563; line-height: 1.55; margin: 0 0 20px; font-size: 15px; }
      label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        font-size: 15px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none;
        margin-bottom: 16px;
      }
      input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.12); }
      button {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .status { margin-top: 16px; font-size: 14px; line-height: 1.5; }
      .status--error { color: #b91c1c; }
      .status--ok { color: #047857; }
      .link { display: inline-block; margin-top: 20px; color: #111827; font-size: 14px; font-weight: 600; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">TechStore</p>
      <h1>Новый пароль</h1>
      <p id="lead">Придумайте новый пароль для аккаунта. Ссылка действует ограниченное время и только один раз.</p>

      <form id="form" novalidate>
        <label for="password">Новый пароль</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Минимум 8 символов" />
        <label for="confirm">Повторите пароль</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Повторите пароль" />
        <button id="submit" type="submit">Сохранить пароль</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <a id="back" class="link" href="__FRONTEND_URL__/#/login">← Вернуться к входу</a>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search)
      const token = params.get('token')
      const form = document.getElementById('form')
      const password = document.getElementById('password')
      const confirm = document.getElementById('confirm')
      const submit = document.getElementById('submit')
      const status = document.getElementById('status')
      const lead = document.getElementById('lead')
      const back = document.getElementById('back')

      if (!token) {
        form.hidden = true
        lead.hidden = true
        status.className = 'status status--error'
        status.textContent = 'Ссылка недействительна: в ней отсутствует токен. Запросите новое письмо.'
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        status.className = 'status'
        status.textContent = ''

        if (password.value.length < 8) {
          status.className = 'status status--error'
          status.textContent = 'Пароль должен содержать минимум 8 символов.'
          return
        }
        if (password.value !== confirm.value) {
          status.className = 'status status--error'
          status.textContent = 'Пароли не совпадают.'
          return
        }

        submit.disabled = true
        submit.textContent = 'Сохраняем…'

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: password.value }),
          })
          const data = await response.json().catch(() => ({}))

          if (!response.ok) {
            throw new Error(data?.error?.message || 'Ссылка недействительна или истекла.')
          }

          form.hidden = true
          lead.hidden = true
          status.className = 'status status--ok'
          status.textContent = 'Пароль обновлён. Теперь можно войти с новым паролем.'
          back.textContent = 'Перейти к входу →'
          history.replaceState(null, '', '/reset-password')
        } catch (error) {
          status.className = 'status status--error'
          status.textContent = error.message
        } finally {
          submit.disabled = false
          submit.textContent = 'Сохранить пароль'
        }
      })
    </script>
  </body>
</html>
