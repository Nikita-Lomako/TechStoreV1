<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Восстановление пароля — TechStore</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08);
      }
      .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 20px; margin: 0 0 24px; }
      h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
      p { color: #4b5563; line-height: 1.55; margin: 0 0 20px; font-size: 15px; }
      label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        font-size: 15px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none;
      }
      input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.12); }
      button {
        width: 100%;
        height: 46px;
        margin-top: 18px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .status { margin-top: 16px; font-size: 14px; line-height: 1.5; }
      .status--error { color: #b91c1c; }
      .status--ok { color: #047857; }
      .link { display: inline-block; margin-top: 20px; color: #111827; font-size: 14px; font-weight: 600; }
      .dev { margin-top: 14px; padding: 12px; background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 8px; word-break: break-all; font-size: 13px; }
      .dev a { color: #1d4ed8; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">TechStore</p>
      <h1>Восстановление пароля</h1>
      <p>Укажите email аккаунта. Мы отправим короткоживущую ссылку для смены пароля.</p>

      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        <button id="submit" type="submit">Отправить ссылку</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="dev" class="dev" hidden></div>
      <a class="link" href="__FRONTEND_URL__/#/login">← Вернуться к входу</a>
    </main>

    <script>
      const form = document.getElementById('form')
      const email = document.getElementById('email')
      const submit = document.getElementById('submit')
      const status = document.getElementById('status')
      const dev = document.getElementById('dev')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        status.className = 'status'
        status.textContent = ''
        dev.hidden = true

        const value = email.value.trim()
        if (!value) {
          status.className = 'status status--error'
          status.textContent = 'Введите email.'
          return
        }

        submit.disabled = true
        submit.textContent = 'Отправляем…'

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: value }),
          })
          const data = await response.json().catch(() => ({}))

          if (!response.ok) {
            throw new Error(data?.error?.message || 'Не удалось отправить письмо. Попробуйте позже.')
          }

          form.hidden = true
          status.className = 'status status--ok'
          status.textContent = 'Если такой аккаунт существует, письмо со ссылкой уже отправлено.'

          if (data.resetToken) {
            const link = '/reset-password?token=' + encodeURIComponent(data.resetToken)
            dev.hidden = false
            dev.innerHTML = 'SMTP не настроен, ссылка для теста:<br /><a href="' + link + '">' + link + '</a>'
          }
        } catch (error) {
          status.className = 'status status--error'
          status.textContent = error.message
        } finally {
          submit.disabled = false
          submit.textContent = 'Отправить ссылку'
        }
      })
    </script>
  </body>
</html>
